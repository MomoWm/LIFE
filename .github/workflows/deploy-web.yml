name: Deploy web app to GitHub Pages

on:
  push:
    branches: [claude/chat-session-yuw7d2, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Supabase publishable values — these ship inside the client bundle by
      # design (EXPO_PUBLIC_*); row level security protects the data.
      EXPO_PUBLIC_SUPABASE_URL: https://txoeibwdqrfuoyonponb.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_fUsvuR1tGG3Xe69d86nLoQ_86LXSN_j
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export static web build
        run: npx expo export --platform web

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # Publishing to a gh-pages branch auto-enables GitHub Pages for the
      # repo — no Settings visit and no Pages API permissions needed, unlike
      # actions/configure-pages (whose site creation fails for the default
      # workflow token: "Resource not accessible by integration").
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
